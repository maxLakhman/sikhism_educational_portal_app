<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Model Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding-bottom: 30px;
    }

    nav.navbar {
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .model-viewer-container {
      margin-top: 30px;
    }

    #renderCanvas {
      width: 100%;
      height: 60vh;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    #modelSelector {
      font-size: 1rem;
      padding: 10px;
      border-radius: 8px;
    }

    .form-select {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">3D Model Viewer</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container model-viewer-container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card p-4 shadow-sm">
          <h3 class="card-title text-center mb-3">Select and View a 3D Model</h3>
          <select id="modelSelector" class="form-select">
            {% for model in models %}
              <option value="{{ model.path }}">{{ model.uid }}</option>
            {% endfor %}
          </select>
          <canvas id="renderCanvas" class="mt-3"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Babylon.js CDN -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.js"></script>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Babylon.js Viewer Script -->
  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    let currentScene = null;

    function createScene(modelUrl) {
      if (currentScene) {
        currentScene.dispose();
      }

      const scene = new BABYLON.Scene(engine);
      const camera = new BABYLON.ArcRotateCamera("Camera", Math.PI / 2, Math.PI / 3, 4, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);
      const light = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(1, 1, 0), scene);

      BABYLON.SceneLoader.Append("", modelUrl, scene, function () {
        engine.runRenderLoop(() => scene.render());
      });

      currentScene = scene;
    }

    const modelSelector = document.getElementById("modelSelector");
    if (modelSelector && modelSelector.value) {
      createScene(modelSelector.value);
    }

    modelSelector.addEventListener("change", (e) => {
      createScene(e.target.value);
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
