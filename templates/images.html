<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Model Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding-bottom: 30px;
    }

    nav.navbar {
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .model-viewer-container {
      margin-top: 30px;
    }

    #renderCanvas, .sketchfab-embed iframe {
      width: 100%;
      height: 60vh;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .form-select {
      margin-bottom: 20px;
    }

    .sketchfab-attribution {
      font-size: 13px;
      font-weight: normal;
      margin: 5px;
      color: #4A4A4A;
    }

    .sketchfab-attribution a {
      font-weight: bold;
      color: #1CAAD9;
    }

    .model-container {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">3D Model Viewer</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container model-viewer-container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card p-4 shadow-sm">
          <h3 class="card-title text-center mb-3">Select and View a 3D Model</h3>
          
          <!-- Model Selection Dropdown -->
          <select id="modelSelector" class="form-select">
            {% for model in models %}
              <option value="{{ model.path }}" data-type="local">{{ model.uid }}</option>
            {% endfor %}
            
            <!-- Sketchfab Models - Add new ones here -->
            <option value="warrior" data-type="sketchfab">Sikh Warrior</option>
            <option value="manuscript" data-type="sketchfab">Sikh Manuscript</option>
            <option value="helmet" data-type="sketchfab">Sikh Helmet</option>
            <option value="temple" data-type="sketchfab">Sikh Temple</option>
            <!-- Add new Sketchfab models like this:

            <option value="your-model-id" data-type="sketchfab">Your Model Name</option>
            
            -->
          </select>

          <!-- Babylon.js Canvas -->
          <canvas id="renderCanvas" class="model-container"></canvas>

          <!-- Sketchfab Model Templates -->
          <div id="sketchfab-warrior" class="model-container sketchfab-embed">
            <iframe title="Sikh Warrior" 
                    src="https://sketchfab.com/models/4d941fd084074232ab782be7d208770e/embed"
                    frameborder="0" allowfullscreen allow="autoplay; fullscreen; xr-spatial-tracking">
            </iframe>
          </div>

          <div id="sketchfab-manuscript" class="model-container sketchfab-embed">
            <iframe title="Sikh Manuscript"
                    src="https://sketchfab.com/models/48832d09b74b4250b23282436caff6c7/embed"
                    frameborder="0" allowfullscreen allow="autoplay; fullscreen; xr-spatial-tracking">
            </iframe>
            <p class="sketchfab-attribution">
              <a href="https://sketchfab.com/3d-models/sikh-manuscript-48832d09b74b4250b23282436caff6c7" target="_blank">Sikh Manuscript</a>
              by <a href="https://sketchfab.com/SikhMuseumInitiative" target="_blank">Sikh Museum Initiative</a>
              on <a href="https://sketchfab.com" target="_blank">Sketchfab</a>
            </p>
          </div>

          <div id="sketchfab-da2d641a4eb64a879f3b4ba8f4e6f68f" class="model-container sketchfab-embed">
            <iframe title="Sikh Helmet"
                    src="https://sketchfab.com/models/da2d641a4eb64a879f3b4ba8f4e6f68f/embed"
                    frameborder="0" allowfullscreen
                    allow="autoplay; fullscreen; xr-spatial-tracking"
                    mozallowfullscreen="true" webkitallowfullscreen="true"
                    xr-spatial-tracking execution-while-out-of-viewport execution-while-not-rendered web-share>
            </iframe>
            <p class="sketchfab-attribution">
              <a href="https://sketchfab.com/3d-models/sikh-helmet-da2d641a4eb64a879f3b4ba8f4e6f68f?utm_medium=embed&utm_campaign=share-popup&utm_content=da2d641a4eb64a879f3b4ba8f4e6f68f"
                target="_blank">Sikh Helmet</a>
              by <a href="https://sketchfab.com/SikhMuseumInitiative?utm_medium=embed&utm_campaign=share-popup&utm_content=da2d641a4eb64a879f3b4ba8f4e6f68f"
                target="_blank">Sikh Museum Initiative</a>
              on <a href="https://sketchfab.com?utm_medium=embed&utm_campaign=share-popup&utm_content=da2d641a4eb64a879f3b4ba8f4e6f68f"
                target="_blank">Sketchfab</a>
            </p>
          </div>

          <div id="sketchfab-626c0ca5d84f45bca4ba8725f12bfcc9" class="model-container sketchfab-embed">
            <iframe title="Golden Temple"
                    src="https://sketchfab.com/models/626c0ca5d84f45bca4ba8725f12bfcc9/embed"
                    frameborder="0" allowfullscreen allow="autoplay; fullscreen; xr-spatial-tracking">
            </iframe>
            <p class="sketchfab-attribution">
              <a href="https://sketchfab.com/3d-models/golden-temple-626c0ca5d84f45bca4ba8725f12bfcc9" target="_blank">Golden Temple</a>
              by <a href="https://sketchfab.com/sonalveer42" target="_blank">sonalveer42</a>
              on <a href="https://sketchfab.com" target="_blank">Sketchfab</a>
            </p>
          </div>


          <!-- Template for new Sketchfab models (copy and modify this) -->
          <!--
          <div id="sketchfab-your-model-id" class="model-container sketchfab-embed">
            <iframe title="Your Model Name"
                    src="https://sketchfab.com/models/YOUR-MODEL-ID/embed"
                    frameborder="0" allowfullscreen allow="autoplay; fullscreen; xr-spatial-tracking">
            </iframe>
            <p class="sketchfab-attribution">
              <a href="https://sketchfab.com/3d-models/your-model-url" target="_blank">Model Name</a>
              by <a href="https://sketchfab.com/artist" target="_blank">Artist Name</a>
              on <a href="https://sketchfab.com" target="_blank">Sketchfab</a>
            </p>
          </div>
          -->
        </div>
      </div>
    </div>
  </div>

  <!-- Babylon.js CDN -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.js"></script>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const modelSelector = document.getElementById("modelSelector");
    const engine = new BABYLON.Engine(canvas, true);
    let currentScene = null;

    // Model configuration
    const sketchfabModels = {
      'warrior': {
        containerId: 'sketchfab-warrior'
      },
      'manuscript': {
        containerId: 'sketchfab-manuscript'
      },
      'helmet': {
        containerId: 'sketchfab-da2d641a4eb64a879f3b4ba8f4e6f68f'
      },
      'temple': {
        containerId: 'sketchfab-626c0ca5d84f45bca4ba8725f12bfcc9'
      },
      // Add new models like this:
      // 'your-model-id': {
      //   containerId: 'sketchfab-your-model-id'
      // }
    };

    function createScene(modelUrl) {
      if (currentScene) currentScene.dispose();

      const scene = new BABYLON.Scene(engine);
      const camera = new BABYLON.ArcRotateCamera("Camera", Math.PI / 2, Math.PI / 3, 4, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);
      new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(1, 1, 0), scene);

      BABYLON.SceneLoader.Append("", modelUrl, scene, function() {
        scene.executeWhenReady(() => {
          const meshes = scene.meshes.filter(m => m.name !== "__root__" && m.isVisible);
          if (meshes.length > 0) {
            const boundingVectors = meshes.map(mesh => mesh.getBoundingInfo().boundingBox);
            const min = boundingVectors.reduce((acc, box) => BABYLON.Vector3.Minimize(acc, box.minimumWorld), boundingVectors[0].minimumWorld.clone());
            const max = boundingVectors.reduce((acc, box) => BABYLON.Vector3.Maximize(acc, box.maximumWorld), boundingVectors[0].maximumWorld.clone());
            const center = min.add(max).scale(0.5);
            const size = max.subtract(min).length();

            camera.setTarget(center);
            camera.radius = size * 1.2;
            camera.alpha = Math.PI / 4;
            camera.beta = Math.PI / 3;
          }
          engine.runRenderLoop(() => scene.render());
        });
      });

      currentScene = scene;
    }

    function handleSelection() {
      const selectedOption = modelSelector.selectedOptions[0];
      const modelValue = selectedOption.value;
      const modelType = selectedOption.dataset.type;

      // Hide all containers first
      document.querySelectorAll('.model-container').forEach(el => {
        el.style.display = 'none';
      });

      if (modelType === 'sketchfab') {
        // Show the selected Sketchfab model
        const modelConfig = sketchfabModels[modelValue];
        if (modelConfig) {
          document.getElementById(modelConfig.containerId).style.display = 'block';
        }
        
        // Clean up Babylon.js if needed
        if (currentScene) {
          currentScene.dispose();
          currentScene = null;
        }
      } else {
        // Show Babylon.js canvas for local models
        canvas.style.display = 'block';
        createScene(modelValue);
      }
    }

    // Initialize
    window.addEventListener("DOMContentLoaded", () => {
      if (modelSelector && modelSelector.options.length > 0) {
        handleSelection();
      }
    });

    modelSelector.addEventListener("change", handleSelection);
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
